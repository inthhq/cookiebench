name: cookiebench
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: cookiebench
      POSTGRES_USER: cookiebench
      POSTGRES_PASSWORD: cookiebench
    ports:
      - "127.0.0.1:${COOKIEBENCH_POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookiebench -d cookiebench"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
