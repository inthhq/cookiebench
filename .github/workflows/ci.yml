name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: cookiebench
          POSTGRES_PASSWORD: cookiebench
          POSTGRES_DB: cookiebench
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U cookiebench' --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      COOKIEBENCH_CLI_BROWSER_TESTS: "1"
      TEST_DATABASE_URL: postgres://cookiebench:cookiebench@localhost:5432/cookiebench
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm check
      # The browser tests in `pnpm check` already build every c15t fixture.
      # Build only the competitor fixtures, which no test starts.
      - run: pnpm exec turbo run build --filter='with-*' --filter='!with-c15t-*'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: packages/runner/test-results/
